plugins {
    id 'java'
    id 'application'
}

group = 'ru.nsu.aeliseev2.taskj1'
version = 'unspecified'

application {
    mainClass = 'ru.nsu.aeliseev2.taskj1.keyclient.Application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':common')
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}